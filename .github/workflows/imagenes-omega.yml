name: Verificar fotografías de la migración Omega

on:
  push:
    branches: [codex/migrar-omega]
    paths:
      - scripts/omega_images.py
      - scripts/collect_omega_images.py
      - .github/workflows/imagenes-omega.yml

permissions:
  contents: read
  actions: read

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar descarga y caché de imágenes
        run: python3 -m unittest discover -s tests -p test_omega_images.py -v
      - name: Esperar la captura pública en curso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, time
          url = 'https://api.github.com/repos/Jhowsset011/kodex-gaming-/actions/runs/38092656270'
          for attempt in range(20):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  run = json.load(response)
              if run['status'] == 'completed':
                  if run['conclusion'] != 'success':
                      raise SystemExit('La captura pública falló: no descargar fotos de un lote incompleto')
                  break
              time.sleep(30)
          else:
              raise SystemExit('La captura pública aún no terminó')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: omega-migration-audit
          path: omega-source-audit
          run-id: 38092656270
          github-token: ${{ github.token }}
      - name: Descargar fotografías públicas verificadas
        run: python3 scripts/collect_omega_images.py --source-file omega-source-audit/sources.json --output omega-images-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-images-audit
          path: omega-images-audit/
          retention-days: 3
