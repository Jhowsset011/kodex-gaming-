name: Sincronizar catálogo Omega

on:
  schedule:
    - cron: '0 10 * * *' # 6:00 a. m., República Dominicana (UTC-4)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - producto.html
      - css/**
      - js/**
      - img/**
      - scripts/**
      - tests/**
      - .github/workflows/sync-catalogo.yml

concurrency:
  group: catalogo-omega
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar sincronización y clasificación
        run: python3 -m unittest discover -s tests -v
      - name: Comprobar reglas privadas de venta
        id: pricing
        env:
          OMEGA_PRICING_RULES: ${{ secrets.OMEGA_PRICING_RULES }}
        run: |
          if [ -z "${OMEGA_PRICING_RULES:-}" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Falta OMEGA_PRICING_RULES en los secrets de Actions. El catálogo publicado se conserva; la actualización automática queda pendiente.'
          else
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from omega_pricing import PricingPolicy; PricingPolicy.from_env()"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar precios, disponibilidad, fichas e imágenes
        if: steps.pricing.outputs.enabled == 'true'
        env:
          OMEGA_PRICING_RULES: ${{ secrets.OMEGA_PRICING_RULES }}
        run: python3 scripts/sync_omega.py
      - name: Guardar catálogo
        if: steps.pricing.outputs.enabled == 'true'
        run: |
          git config user.name 'kodex-sync'
          git config user.email 'kodex-sync@users.noreply.github.com'
          git add js/productos.json img/catalogo
          if git diff --cached --quiet; then
            echo 'Sin cambios en el catálogo.'
          else
            git commit -m 'Actualizar catálogo seleccionado desde Omega'
            git push origin HEAD:main
          fi
      - name: Preparar sitio actualizado
        run: |
          mkdir _site
          cp index.html producto.html _site/
          cp -R css js img _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Human pushes use the existing main/root Pages deployment. Scheduled and
    # manual executions publish their own complete artifact, including CNAME.
    if: github.event_name != 'push'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Comprobar configuración de GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar catálogo en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
