name: Sincronizar catálogo Nexcom

on:
  schedule:
    - cron: '0 10 * * *' # 6:00 a. m., República Dominicana (UTC-4)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - producto.html
      - css/**
      - js/**
      - img/**
      - scripts/**
      - tests/test_sync_nexcom.py
      - .github/workflows/sync-catalogo.yml

concurrency:
  group: catalogo-nexcom
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar sincronización y clasificación
        run: python3 -m unittest discover -s tests -v
      - name: Actualizar precios, disponibilidad, fichas e imágenes
        run: python3 scripts/sync_nexcom.py
      - name: Guardar catálogo
        run: |
          git config user.name 'kodex-sync'
          git config user.email 'kodex-sync@users.noreply.github.com'
          git add js/productos.json img/catalogo
          if git diff --cached --quiet; then
            echo 'Sin cambios en el catálogo.'
          else
            git commit -m 'Actualizar catálogo seleccionado desde Nexcom'
            git push origin HEAD:main
          fi
      - name: Preparar sitio actualizado
        run: |
          mkdir _site
          cp index.html producto.html _site/
          cp -R css js img _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pages publishes main automatically on human pushes. Bot commits do not
    # trigger that build, so scheduled/manual syncs deploy their own artifact.
    if: github.event_name != 'push'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Comprobar configuración de GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar catálogo en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
